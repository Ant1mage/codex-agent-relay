name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace
      - name: UI (Leptos → WASM)
        run: cargo check --target wasm32-unknown-unknown
        working-directory: apps/relay-desktop/ui

  package-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Install the Tauri CLI
        # The macOS runner image ships cargo and rustc but not the Tauri CLI, and
        # the app has no package.json to pull @tauri-apps/cli from: without this
        # the build step dies with "no such command: tauri".
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build the UI
        # Trunk reads NO_COLOR and only accepts true/false, so an exported "1"
        # from the environment would abort it.
        run: env -u NO_COLOR trunk build --release
        working-directory: apps/relay-desktop/ui
      - name: Build the daemon and the MCP server
        # `bundle.resources` copies these two into Contents/Resources/bin, which is
        # where the shell and the Codex integration look for them.
        run: cargo build --release -p relayd -p relay-mcp
      - name: Build the app
        run: cargo tauri build --target aarch64-apple-darwin
        working-directory: apps/relay-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-macOS-arm64
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
