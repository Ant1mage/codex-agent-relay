name: Release macOS

# Tags only, deliberately: pushing a branch or a pull request must never publish
# a release. A 0-job "failure" run on a branch push is GitHub reporting that the
# workflow file itself could not be parsed for that commit — it is recorded
# before any trigger filter, such as the tag filter below, is considered.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Install the Tauri CLI
        # The macOS runner image ships cargo and rustc but not the Tauri CLI, and
        # the app has no package.json to pull @tauri-apps/cli from: without this
        # the build step dies with "no such command: tauri".
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build the UI
        run: env -u NO_COLOR trunk build --release
        working-directory: apps/relay-desktop/ui
      - name: Build the daemon and the MCP server
        # `bundle.resources` copies these two into Contents/Resources/bin, which
        # is where the shell and the Codex integration look for them.
        run: cargo build --release -p relayd -p relay-mcp
      - name: Stage the updater public key
        # The public half of TAURI_SIGNING_PRIVATE_KEY. It is not a secret, but it
        # has to reach the bundle: an app built with an empty
        # `plugins.updater.pubkey` can never verify an update, so it reports the
        # updater as unsupported forever.
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          key="$(printf '%s' "$TAURI_UPDATER_PUBKEY" | tr -d '[:space:]')"
          if [ -z "$key" ]; then
            echo "::error title=TAURI_UPDATER_PUBKEY is missing::The release would embed an empty updater public key, so the packaged app could never install an update. Store the public half of TAURI_SIGNING_PRIVATE_KEY (cargo tauri signer generate) as the TAURI_UPDATER_PUBKEY repository secret."
            exit 1
          fi
          python3 - "$key" <<'PY'
          import base64
          import sys

          key = sys.argv[1]
          try:
              decoded = base64.b64decode(key + "=" * (-len(key) % 4), validate=True).decode("utf-8")
          except Exception as error:
              sys.exit(f"::error title=TAURI_UPDATER_PUBKEY is not a Tauri public key::the secret is not base64-encoded text ({error})")
          if "minisign public key" not in decoded:
              sys.exit("::error title=TAURI_UPDATER_PUBKEY is not a Tauri public key::the decoded secret is not a minisign public key; copy the `Public key` line printed by `cargo tauri signer generate`")
          PY
          python3 -c 'import json,sys; print(json.dumps({"plugins":{"updater":{"pubkey":sys.argv[1]}}}))' "$key" > "$RUNNER_TEMP/updater-pubkey.json"
          echo "staged the updater key override in $RUNNER_TEMP/updater-pubkey.json"
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Notarization credentials
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The build script refuses to finish when this is set and the merged
          # configuration carries no updater public key.
          RELAY_REQUIRE_UPDATER_PUBKEY: "1"
        run: cargo tauri build --target aarch64-apple-darwin --config "$RUNNER_TEMP/updater-pubkey.json"
        working-directory: apps/relay-desktop
      - name: Sign the bundled daemon and MCP server
        # bundle.resources lands them in Contents/Resources/bin, so that is the
        # path that has to be signed; the bundle is re-sealed afterwards.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="target/aarch64-apple-darwin/release/bundle/macos/Relay.app"
          for binary in relayd relay-mcp; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP/Contents/Resources/bin/$binary"
          done
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP"
      - name: Release sanity check — bundled binaries, sidecar paths, signatures
        # Fails the release instead of publishing an app whose daemon is missing,
        # not executable, or only signed at a path that does not exist.
        run: |
          set -euo pipefail
          APP="target/aarch64-apple-darwin/release/bundle/macos/Relay.app"
          broken=0
          for binary in relayd relay-mcp; do
            path="$APP/Contents/Resources/bin/$binary"
            if [ ! -f "$path" ]; then
              echo "::error title=Missing bundled $binary::$path does not exist. bundle.resources must map target/release/$binary to bin/$binary."
              broken=1
              continue
            fi
            if [ ! -x "$path" ]; then
              echo "::error title=$binary is not executable::$path has no executable bit."
              broken=1
              continue
            fi
            "$path" --version
          done
          [ "$broken" -eq 0 ]
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Contents/Resources/bin/relayd"
          codesign --verify --strict --verbose=2 "$APP/Contents/Resources/bin/relay-mcp"
      - name: Notarize and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          APP="target/aarch64-apple-darwin/release/bundle/macos/Relay.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Relay.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Relay.zip" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
      - name: Verify the updater artifacts
        # A release without a signed update must not be published: the updater
        # refuses an artifact whose signature does not verify against the
        # embedded public key.
        run: |
          set -euo pipefail
          BUNDLE="target/aarch64-apple-darwin/release/bundle/macos"
          shopt -s nullglob
          archives=("$BUNDLE"/*.app.tar.gz)
          signatures=("$BUNDLE"/*.app.tar.gz.sig)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error title=No updater archive::No $BUNDLE/*.app.tar.gz was produced. Keep bundle.createUpdaterArtifacts enabled."
            exit 1
          fi
          if [ "${#signatures[@]}" -eq 0 ]; then
            echo "::error title=No updater signature::No $BUNDLE/*.app.tar.gz.sig was produced, so no update can be verified. Check TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi
          for signature in "${signatures[@]}"; do
            if [ ! -s "$signature" ]; then
              echo "::error title=Empty updater signature::$signature is empty."
              exit 1
            fi
          done
          python3 - "$BUNDLE/latest.json" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          if not path.is_file() or path.stat().st_size == 0:
              sys.exit("::error title=Missing latest.json::" + str(path) + " was not produced")
          manifest = json.loads(path.read_text())
          platforms = manifest.get("platforms", {})
          entry = platforms.get("darwin-aarch64")
          if not entry:
              sys.exit("::error title=latest.json has no darwin-aarch64 entry::" + ", ".join(sorted(platforms)))
          if not entry.get("signature"):
              sys.exit("::error title=latest.json has no signature::the darwin-aarch64 entry carries no signature")
          if not entry.get("url"):
              sys.exit("::error title=latest.json has no url::the darwin-aarch64 entry carries no url")
          print("latest.json: darwin-aarch64 -> " + str(entry.get("url")))
          PY
      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Relay $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz \
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig \
            target/aarch64-apple-darwin/release/bundle/macos/latest.json --clobber
