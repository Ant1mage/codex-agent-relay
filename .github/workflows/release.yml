name: Release macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Build the UI
        run: trunk build --release
        working-directory: apps/relay-desktop/ui
      - name: Build the daemon and the MCP server
        # `bundle.resources` copies these two into Contents/Resources, which is
        # where the shell and the Codex integration look for them.
        run: cargo build --release -p relayd -p relay-mcp
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Notarization credentials
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and publish
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target aarch64-apple-darwin
        working-directory: apps/relay-desktop
      - name: Sign the bundled daemon and MCP server
        # They live in Contents/Resources, so they are signed explicitly and the
        # bundle is re-sealed afterwards.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP="target/release/bundle/macos/Relay.app"
          for binary in relayd relay-mcp; do
            codesign --force --options runtime --timestamp               --sign "$APPLE_SIGNING_IDENTITY" "$APP/Contents/Resources/$binary"
          done
          codesign --force --options runtime --timestamp             --sign "$APPLE_SIGNING_IDENTITY" "$APP"
      - name: Verify the signature and the bundled binaries
        run: |
          APP="target/release/bundle/macos/Relay.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Contents/Resources/relayd"
          codesign --verify --strict --verbose=2 "$APP/Contents/Resources/relay-mcp"
          "$APP/Contents/Resources/relayd" --version || true
          "$APP/Contents/Resources/relay-mcp" --version || true
      - name: Notarize and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          APP="target/release/bundle/macos/Relay.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Relay.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Relay.zip" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "Relay ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            target/release/bundle/dmg/*.dmg \
            target/release/bundle/macos/*.app.tar.gz \
            target/release/bundle/macos/*.app.tar.gz.sig \
            target/release/bundle/macos/latest.json --clobber
