[package]
name = "relay-api"
description = "Relay's wire contract and the daemon's HTTP/SSE surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["server"]
# The wire contract alone (serde types). The WASM UI depends on this so both
# sides validate the same document instead of keeping two copies of the shape.
contract = []
# The daemon's HTTP/SSE surface.
server = ["contract", "dep:async-trait", "dep:axum", "dep:tokio", "dep:relay-storage", "dep:async-stream", "dep:futures", "dep:tracing"]

[dependencies]
relay-config.workspace = true
relay-core.workspace = true
serde = { workspace = true }
serde_json.workspace = true

async-stream = { version = "0.3", optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
relay-storage = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
