[workspace]
resolver = "2"
members = [
  "crates/relay-core",
  "crates/relay-storage",
  "crates/relay-config",
  "crates/relay-adapters",
  "crates/relay-api",
  "crates/relay-codex",
  "apps/relayd",
  "apps/relay-mcp",
  "apps/relay-desktop/src-tauri",
]
exclude = ["apps/relay-desktop/ui"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Ant1mage"]
repository = "https://github.com/Ant1mage/codex-agent-relay"

[workspace.dependencies]
relay-core = { path = "crates/relay-core" }
relay-storage = { path = "crates/relay-storage" }
relay-config = { path = "crates/relay-config" }
relay-adapters = { path = "crates/relay-adapters" }
relay-api = { path = "crates/relay-api" }
relay-codex = { path = "crates/relay-codex" }

async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures = "0.3"
libc = "0.2"
regex = "1"
rmcp = { version = "3", features = ["server", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "io-std",
  "sync",
  "time",
  "fs",
  "signal",
  "net",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
which = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
