[package]
name = "relayd"
description = "Relay's local daemon: it owns configuration, the runtime scan, the HTTP/SSE surface and every worker process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "relayd"
path = "src/lib.rs"

[[bin]]
name = "relayd"
path = "src/main.rs"

[dependencies]
relay-adapters.workspace = true
relay-api.workspace = true
relay-codex.workspace = true
relay-config.workspace = true
relay-core.workspace = true
relay-storage.workspace = true
async-trait.workspace = true
axum.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
