[package]
name = "relay-ui"
description = "Relay's Leptos + Trunk UI: the read-only inspector and the control panel in one bundle."
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
publish = false

# The UI is built by Trunk for wasm32 on its own. The empty workspace table keeps
# it out of the daemon workspace so this wasm-only dependency set can never leak
# into the server build (the root manifest also excludes this directory).
[workspace]

[dependencies]
# The wire contract only: serde types, no axum/rusqlite/tokio. Clients validate
# the exact document the daemon emits instead of keeping a copy of the shape.
relay-api = { path = "../../../crates/relay-api", default-features = false }
relay-core = { path = "../../../crates/relay-core" }

leptos = { version = "0.8", features = ["csr"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
similar = "3.2"
leptos_icons = "0.7.1"
icondata = { version = "0.7", default-features = false, features = ["lucide"] }
thaw = { version = "=0.5.0-beta", features = ["csr"] }
leptos-use = { version = "0.19", default-features = false, features = ["use_color_mode", "use_scroll", "use_event_listener"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Clipboard",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventSource",
  "EventTarget",
  "History",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "Location",
  "MediaQueryList",
  "MessageEvent",
  "Navigator",
  "Node",
  "NodeList",
  "Storage",
  "Url",
  "UrlSearchParams",
  "Window",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
