[package]
name = "relay-desktop"
description = "Relay's desktop shell: menu bar item, control panel, daemon supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "relay_desktop"
path = "src/lib.rs"

[[bin]]
name = "relay-desktop"
path = "src/main.rs"

# The shell is Rust only: no Node, no npm, no frontend build step. The panel and
# the inspector are served by relayd, so nothing here bundles a JavaScript
# toolchain.
[dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
relay-api.workspace = true
relay-config.workspace = true
libc.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
semver = "1"
serde = { workspace = true }
serde_json.workspace = true
sys-locale = "0.3"
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
