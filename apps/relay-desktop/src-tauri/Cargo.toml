[package]
name = "relay-desktop"
description = "Relay's desktop shell: menu bar item, control panel, daemon supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "relay_desktop"
path = "src/lib.rs"

[[bin]]
name = "relay-desktop"
path = "src/main.rs"

# The shell is Rust only: no Node, no npm, no frontend build step. The panel and
# the inspector are served by relayd, so nothing here bundles a JavaScript
# toolchain.
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
relay-api.workspace = true
relay-config.workspace = true
libc.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json.workspace = true
sys-locale = "0.3"
tokio = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
