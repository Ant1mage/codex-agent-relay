[package]
name = "relay-mcp"
description = "Relay's MCP server: the protocol front-end Codex delegates through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "relay-mcp"
path = "src/main.rs"

[dependencies]
relay-api.workspace = true
relay-config.workspace = true
relay-core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The end-to-end test drives the real MCP binary against a real relayd engine.
relayd = { path = "../relayd" }
relay-adapters.workspace = true
relay-api.workspace = true
relay-codex.workspace = true
relay-config.workspace = true
relay-core.workspace = true
relay-storage.workspace = true
async-trait.workspace = true
axum.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "net"] }
