<svg xmlns="http://www.w3.org/2000/svg" width="452" height="452" viewBox="286 324 452 452" role="img" aria-label="Relay">
  <title>Relay mark</title>
  <!--
    Relay routing mark, tightly cropped - for the in-app brand tile only.

    This is relay-icon.svg with the viewBox reduced to the mark's own bounds,
    padded out to a square (286,324 452x452) so it scales into a square slot
    without stretching. The mark fills its box instead of floating inside the
    icon's transparent margin. Use it wherever the mark is drawn small on a
    light surface (the sidebar brand); the full icon would place a ~50%-size
    mark inside the 22px slot and read as a blank white block.

    Coordinates match relay-icon.svg; keep them in sync if the mark changes.
  -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#2c3540" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#2c3540" stop-opacity="0.90"/>
      <stop offset="1.00" stop-color="#2c3540" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M315 550 H497" stroke="url(#fade)" stroke-width="58"/>
    <path d="M315 465 H420 C458 465 470 409 508 409 H708" stroke="#2c3540" stroke-width="58"/>
    <path d="M315 635 H420 C458 635 470 691 508 691 H708" stroke="#2c3540" stroke-width="58"/>
  </g>

  <g fill="#2c3540">
    <circle cx="708" cy="409" r="61"/>
    <circle cx="708" cy="550" r="61"/>
    <circle cx="708" cy="691" r="61"/>
  </g>
</svg>
