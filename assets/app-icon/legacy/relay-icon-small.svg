<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Relay">
  <title>Relay</title>
  <!--
    Relay app icon - SMALL-SIZE OPTICAL VARIANT.

    Used for 16/32/64px only. At those sizes the detailed mark in
    relay-icon.svg renders with sub-pixel strokes and turns to mush, so this
    variant redraws it: no middle stub, wider strokes, rounder endpoints, and a
    shorter, lower-contrast tile gradient. Same tile rectangle and same
    transparent macOS grid margin as the primary icon, so the two match
    optically when the system picks between them.

    Generated into the icon set by tools/build-icons.sh.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaecf0"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>

    <g fill="none" stroke="#2c3540" stroke-width="78" stroke-linecap="round" stroke-linejoin="round">
      <path d="M330 452 H430 C478 452 486 404 534 404 H652"/>
      <path d="M330 572 H430 C478 572 486 620 534 620 H652"/>
    </g>

    <g fill="#2c3540">
      <circle cx="700" cy="404" r="86"/>
      <circle cx="700" cy="620" r="86"/>
    </g>
  </g>
</svg>
