<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Relay">
  <title>Relay</title>
  <!--
    Relay app icon - vector master.

    Canvas 1024x1024. The tile occupies the central 824x824 (80.5%), which is the
    macOS app-icon grid: the transparent margin is what makes the icon sit at the
    same optical size as native apps in the Dock. Do not scale the tile to the
    canvas edge, or the icon will render oversized.

    All raster assets (PNG sizes, .icns, .ico, the in-app cropped mark) are
    generated from this file by tools/build-icons.sh. Edit this file, not the PNGs.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#e6e8ec"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#2c3540" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#2c3540" stop-opacity="0.90"/>
      <stop offset="1.00" stop-color="#2c3540" stop-opacity="0.42"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>

    <!--
      Routing mark: one path that branches and forwards into three endpoints.
      Distinct strokes only while they are apart; they merge into a single clean
      trunk before the fork, so the mark reads at 16px.
    -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M315 550 H497" stroke="url(#fade)" stroke-width="58"/>
      <path d="M315 465 H420 C458 465 470 409 508 409 H708" stroke="#2c3540" stroke-width="58"/>
      <path d="M315 635 H420 C458 635 470 691 508 691 H708" stroke="#2c3540" stroke-width="58"/>
    </g>

    <!-- Endpoints. Stems above run to each centre and are covered by these discs. -->
    <g fill="#2c3540">
      <circle cx="708" cy="409" r="61"/>
      <circle cx="708" cy="550" r="61"/>
      <circle cx="708" cy="691" r="61"/>
    </g>
  </g>
</svg>
